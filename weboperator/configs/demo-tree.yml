# BrowserGym Experiment Configuration
# Environment Configuration
env:
  task_type: "openended"
  max_steps: 100
  headless: false

experiment:
  results_dir: "./results/openended/gpt-oss-20b"
  
# Agent Configuration
agent:
  mode: "evaluation"
  allow_unauthorized_page: true
  
# Model Configuration
models:
  action_model:
    type: "OpenRouterModel"
    model_name: "openai/gpt-oss-20b:free"

# Components Configuration
components:
  action_validator:
    allow_invalid_page: false

  observation_processor:
    optimized: true
    truncate_error_message: true
  
  recovery_assistant:
    recover_from_invalid_page: true
    recover_from_captcha: true

  backtrack_manager:
    simulation_verified: true
    destruction_aware: true

  action_selector:
    selection_strategy: "action-aware" # highest-reward
    n_candidates: 2
    search_budget: 4
    termination_strategy: "all_agree" # all_agree
    max_depth: 20
    max_steps: 20
  
  action_processor:
    merge_strategy: "sum"
  
  action_generator:
    max_retry: 5
    full_action_space:
      - "click"
      - "fill"
      - "select_option"
      - "goto"
      - "go_back"
      - "scroll"
      - "new_tab"
      - "tab_focus"
      - "tab_close"
      - "stop"
    action_space_type: "adaptive" # fixed
    candidates:
      - name: "simple_action_generator_1"
        model: "action_model"
        history_length: 5
        rephraser: false
        retriever: false
      - name: "simple_action_generator_2"
        model: "action_model"
        history_length: 5
        rephraser: false
        retriever: false
      - name: "simple_action_generator_3"
        model: "action_model"
        history_length: 5
        rephraser: false
        retriever: false